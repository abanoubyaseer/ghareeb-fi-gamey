name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create --project-name ghareeb_fi_gamey --org com.ghareeb.gamey --platforms android fresh_app
      - run: cp -r lib fresh_app/lib
      - run: cp pubspec.yaml fresh_app/pubspec.yaml
      - run: cd fresh_app && flutter pub get
      - run: cd fresh_app && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ghareeb-app
          path: fresh_app/build/app/outputs/flutter-apk/app-release.apk
